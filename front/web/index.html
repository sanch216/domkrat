<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bishkek Smog Simulation — real-time air quality visualization">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Domkrat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Domkrat — Чистый воздух для Бишкека</title>
  <link rel="manifest" href="manifest.json">

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0e1012;
      overflow: hidden;
    }
    .mapbox-container {
      width: 100%;
      height: 100%;
    }
    /* Remove Mapbox logo and attribution for cleaner look */
    .mapboxgl-ctrl-logo { display: none !important; }
    .mapboxgl-ctrl-attrib { display: none !important; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ── Mapbox Bridge: Flutter ↔ Mapbox GL JS ──
    // These functions are called from Dart via dart:js_interop.

    const MAPBOX_TOKEN = 'pk.eyJ1IjoiczB5YSIsImEiOiJjbXBpbXQxOWIwZzluMnBzYjZnZHRsaXZ1In0.q7UZNIGWlkwVn9jdaCpV7A';
    let _mapInstances = {};
    let _markerInstances = {};

    function initMapbox(containerId, centerLat, centerLng, zoom) {
      mapboxgl.accessToken = MAPBOX_TOKEN;

      const map = new mapboxgl.Map({
        container: containerId,
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [centerLng, centerLat],
        zoom: zoom,
        pitch: 30,
        bearing: 0,
        antialias: true,
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      _mapInstances[containerId] = map;

      map.on('load', () => {
        // Add heatmap source
        map.addSource('smog-heatmap', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });

        // Add heatmap layer
        map.addLayer({
          id: 'smog-heat',
          type: 'heatmap',
          source: 'smog-heatmap',
          paint: {
            'heatmap-weight': ['get', 'intensity'],
            'heatmap-intensity': 1.5,
            'heatmap-color': [
              'interpolate', ['linear'], ['heatmap-density'],
              0, 'rgba(0, 0, 0, 0)',
              0.1, 'rgba(34, 138, 86, 0.4)',
              0.3, 'rgba(255, 193, 7, 0.6)',
              0.5, 'rgba(255, 152, 0, 0.7)',
              0.7, 'rgba(255, 87, 34, 0.8)',
              0.9, 'rgba(229, 57, 53, 0.9)',
              1.0, 'rgba(136, 14, 79, 1)'
            ],
            'heatmap-radius': 40,
            'heatmap-opacity': 0.8
          }
        });
      });

      return 'ok';
    }

    function updateHeatmap(containerId, pointsJson) {
      const map = _mapInstances[containerId];
      if (!map) return 'no_map';

      const points = JSON.parse(pointsJson);
      const features = points.map(p => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
        properties: { intensity: p.intensity }
      }));

      const source = map.getSource('smog-heatmap');
      if (source) {
        source.setData({ type: 'FeatureCollection', features: features });
      }
      return 'ok';
    }

    function clearHeatmap(containerId) {
      const map = _mapInstances[containerId];
      if (!map) return;
      const source = map.getSource('smog-heatmap');
      if (source) {
        source.setData({ type: 'FeatureCollection', features: [] });
      }
    }

    function addCityMarker(containerId, id, name, lat, lng, type, color) {
      const map = _mapInstances[containerId];
      if (!map) return;

      // Create marker element
      const el = document.createElement('div');
      el.className = 'city-marker';
      el.id = 'marker-' + id;
      el.style.width = '24px';
      el.style.height = '24px';
      el.style.borderRadius = '50%';
      el.style.backgroundColor = color;
      el.style.border = '2px solid #ffffff';
      el.style.cursor = 'pointer';
      el.style.boxShadow = '0 0 12px ' + color + '80';
      el.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
      el.title = name;

      el.addEventListener('mouseenter', () => {
        el.style.transform = 'scale(1.3)';
        el.style.boxShadow = '0 0 20px ' + color;
      });
      el.addEventListener('mouseleave', () => {
        el.style.transform = 'scale(1.0)';
        el.style.boxShadow = '0 0 12px ' + color + '80';
      });

      // Popup
      const popup = new mapboxgl.Popup({ offset: 25, closeButton: false })
        .setHTML('<div style="background:#15171b;color:#fff;padding:8px 12px;border-radius:8px;font-family:DM Sans,sans-serif;font-size:13px;">'
          + '<strong>' + name + '</strong></div>');

      const marker = new mapboxgl.Marker(el)
        .setLngLat([lng, lat])
        .setPopup(popup)
        .addTo(map);

      if (!_markerInstances[containerId]) _markerInstances[containerId] = {};
      _markerInstances[containerId][id] = marker;
    }

    function removeAllMarkers(containerId) {
      const markers = _markerInstances[containerId];
      if (!markers) return;
      Object.values(markers).forEach(m => m.remove());
      _markerInstances[containerId] = {};
    }

    function flyTo(containerId, lat, lng, zoom) {
      const map = _mapInstances[containerId];
      if (!map) return;
      map.flyTo({ center: [lng, lat], zoom: zoom, duration: 1500 });
    }

    function destroyMap(containerId) {
      const map = _mapInstances[containerId];
      if (map) {
        map.remove();
        delete _mapInstances[containerId];
      }
    }
  </script>
</body>
</html>
